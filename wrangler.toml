name = "cacmn2-construction-os"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "construction-os-db"
database_id = "f2626a84-b82f-4466-ba96-847090d051c7"

[[r2_buckets]]
binding = "R2"
bucket_name = "construction-os-files"
preview_bucket_name = "construction-os-files-preview"

[vars]
APP_NAME = "Construction OS"
APP_ENV = "production"

